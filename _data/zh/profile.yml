kicker: 博士后
affiliation: >-
  [Digital Future Institute (DFI)](https://www.ku.ac.ae/research-institutes/digital-future-institute) ·
  [Khalifa University（哈利法大学）](https://www.ku.ac.ae/) · 阿联酋阿布扎比
address: 阿联酋阿布扎比，邮政信箱 127788
lead: >-
  聚焦电磁信号智能处理，研究频谱智能、无线通信与大模型，致力于构建面向复杂电磁环境的感知与认知方法。
bio:
  - >-
    目前在[Khalifa University（哈利法大学）](https://www.ku.ac.ae/)的
    [Digital Future Institute (DFI)](https://www.ku.ac.ae/research-institutes/digital-future-institute)担任博士后，
    与[梅鲁安·德巴教授（Prof. Mérouane Debbah）](https://scholar.google.com/citations?user=HU5I0X4AAAAJ&hl=en)合作。
  - >-
    2025年6月获[南京航空航天大学](http://www.nuaa.edu.cn)工学博士学位；2024年赴新加坡
    [南洋理工大学](https://www.ntu.edu.sg/)[电气与电子工程学院](https://www.ntu.edu.sg/eee)联合培养，
    合作导师为 IEEE Fellow [Chau Yuen](https://dr.ntu.edu.sg/cris/rp/rp02157) 教授。此前，分别于2017年和2020年
    在[南昌大学](http://www.ncu.edu.cn)获得学士、硕士学位。
research:
  prefix: >-
    长期从事电磁信号智能处理理论与方法研究，已在 IEEE COMST、IEEE JSAC、IEEE TIFS、IEEE TCOM、
    IEEE TCCN 等国际通信权威期刊和会议发表**论文30余篇**。目前，
  suffix: >-
    其中包括**2篇ESI高被引论文**和**1篇封面文章**；申请或授权发明专利4项，参与制定国际标准1项。
service: >-
  获**中国电子教育学会2025年度优秀博士学位论文**，入选南京航空航天大学研究生拔尖创新人才培养“引航计划”。
  长期担任通信领域 IEEE JSAC、IEEE TWC、IEEE TCOM、IEEE WCM，以及人工智能领域 IEEE TNNLS、IEEE JSTARS、
  IEEE GRSM、IEEE CIM、ACM MM 等期刊和会议审稿人；曾担任 IEEE ICC、IEEE CITIC 等国际会议的 TPC Member。
