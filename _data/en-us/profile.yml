kicker: Postdoctoral Fellow
affiliation: >-
  [Digital Future Institute (DFI)](https://www.ku.ac.ae/research-institutes/digital-future-institute) ·
  [Khalifa University](https://www.ku.ac.ae/) · Abu Dhabi, UAE
address: P.O. Box 127788, Abu Dhabi, UAE
lead: >-
  I develop intelligent methods for understanding electromagnetic signals, with a focus on spectrum intelligence,
  wireless communications, and foundation models.
bio:
  - >-
    I am currently a Postdoctoral Fellow at the
    [Digital Future Institute (DFI)](https://www.ku.ac.ae/research-institutes/digital-future-institute),
    [Khalifa University](https://www.ku.ac.ae/), working with
    Prof. [Mérouane Debbah](https://scholar.google.com/citations?user=HU5I0X4AAAAJ&hl=en).
  - >-
    I received my Ph.D. degree from [Nanjing University of Aeronautics and Astronautics](http://www.nuaa.edu.cn)
    in June 2025. In 2024, I was a visiting Ph.D. student at the
    [School of Electrical and Electronic Engineering](https://www.ntu.edu.sg/eee),
    [Nanyang Technological University](https://www.ntu.edu.sg/), under the supervision of
    Prof. [Chau Yuen](https://dr.ntu.edu.sg/cris/rp/rp02157) (IEEE Fellow). Before that, I received my M.Eng. and
    B.S. degrees from [Nanchang University](http://www.ncu.edu.cn) in 2020 and 2017.
research:
  prefix: >-
    My research centers on the theory and methods of intelligent electromagnetic signal processing. I have published
    **more than 30 papers** in leading journals and conferences, including IEEE COMST, IEEE JSAC, IEEE TIFS,
    IEEE TCOM, and IEEE TCCN. According to Google Scholar,
  suffix: >-
    My publications include **two ESI Highly Cited Papers** and **one cover story**. I have also filed or been granted
    four invention patents and contributed to one international standard.
service: >-
  I received the **2025 Excellent Doctoral Dissertation Award of the China Education Society of Electronics (CESE)**
  and was selected for NUAA's Top-notch Postgraduate Innovative Talents Training “Yinhang Project.” I regularly review
  for IEEE JSAC, IEEE TWC, IEEE TCOM, IEEE WCM, IEEE TNNLS, IEEE JSTARS, IEEE GRSM, IEEE CIM, ACM MM, and other venues,
  and have served as a TPC member for IEEE ICC, IEEE CITIC, and other international conferences.
